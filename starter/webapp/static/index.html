<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Day 06 · Demo Data Ingestion &amp; Benchmark</title>
<style>
  :root {
    --bg: #0b1220;
    --panel: #141b2d;
    --panel2: #1b2436;
    --border: #243049;
    --text: #e6edf7;
    --muted: #8da0bd;
    --accent: #38bdf8;
    --a: #f97316;
    --b: #a855f7;
    --c: #22c55e;
    --bubble-user: #2563eb;
    --bubble-bot: #1b2436;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 16px 24px 0;
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 18px; margin: 0 0 2px; font-weight: 700; }
  header .hint { font-size: 12px; color: var(--muted); margin-bottom: 12px; display: block; }
  nav { display: flex; gap: 4px; }
  nav button {
    background: none; border: none; color: var(--muted);
    padding: 10px 16px; font-size: 13px; font-weight: 600; cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  nav button.active { color: var(--accent); border-bottom-color: var(--accent); }
  main { flex: 1; overflow-y: auto; padding: 24px; }
  .tab { display: none; max-width: 1100px; margin: 0 auto; }
  .tab.active { display: block; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-bottom: 22px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .card .num { font-size: 26px; font-weight: 700; color: var(--accent); }
  .card .label { font-size: 12px; color: var(--muted); margin-top: 4px; }

  h2 { font-size: 15px; margin: 28px 0 12px; color: var(--text); }
  h2:first-child { margin-top: 0; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--panel); border-radius: 10px; overflow: hidden; }
  th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
  tr:last-child td { border-bottom: none; }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; }
  .pill.a { background: rgba(249,115,22,.15); color: var(--a); }
  .pill.b { background: rgba(168,85,247,.15); color: var(--b); }
  .pill.c { background: rgba(34,197,94,.15); color: var(--c); }

  .barrow { display: flex; align-items: center; gap: 10px; margin: 6px 0; font-size: 13px; }
  .barrow .barlabel { width: 110px; flex-shrink: 0; color: var(--muted); }
  .barrow .bartrack { flex: 1; background: #0e1627; border-radius: 6px; height: 18px; overflow: hidden; }
  .barrow .barfill { height: 100%; border-radius: 6px; display: flex; align-items: center; padding-left: 8px; font-size: 11px; font-weight: 700; color: #06101f; white-space: nowrap; }

  .note { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.5; }
  .source-tag { font-size: 11px; color: var(--muted); font-style: italic; margin-bottom: 14px; display: block; }

  .doc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .doc-card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
  .doc-card .title { font-weight: 700; margin-bottom: 4px; }
  .doc-card .mien-tag { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--panel2); color: var(--accent); }
  .doc-card .stats { font-size: 12px; color: var(--muted); margin-top: 8px; }

  /* Chat tab */
  #chatTab { display: flex; flex-direction: column; height: 100%; max-width: 900px; }
  .controls { display: flex; gap: 10px; margin-bottom: 14px; align-items: center; flex-wrap: wrap; }
  select {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 10px; font-size: 13px;
  }
  #chat { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; min-height: 300px; }
  .msg { max-width: 820px; display: flex; flex-direction: column; gap: 6px; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.bot { align-self: flex-start; align-items: flex-start; }
  .bubble { padding: 10px 14px; border-radius: 12px; line-height: 1.5; font-size: 14px; white-space: pre-wrap; }
  .msg.user .bubble { background: var(--bubble-user); color: white; border-radius: 12px 12px 2px 12px; }
  .msg.bot .bubble { background: var(--bubble-bot); border-radius: 12px 12px 12px 2px; }
  .evidence { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; background: #0e1627; font-size: 13px; max-width: 820px; }
  .evidence + .evidence { margin-top: 8px; }
  .evidence .meta { display: flex; gap: 10px; flex-wrap: wrap; font-size: 11px; color: var(--muted); margin-bottom: 6px; }
  .evidence .meta span { background: var(--panel2); padding: 2px 8px; border-radius: 999px; }
  .evidence .score { color: var(--accent); font-weight: 600; }
  .evidence .text { color: #cbd5e1; }
  footer { padding: 14px 0 0; display: flex; gap: 10px; }
  footer input { flex: 1; background: var(--panel); border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: 12px 14px; font-size: 14px; }
  footer button { background: var(--accent); color: #0b1220; border: none; border-radius: 10px; padding: 0 20px; font-weight: 600; cursor: pointer; }
  footer button:disabled { opacity: 0.5; cursor: default; }
  .empty { color: var(--muted); text-align: center; margin-top: 60px; font-size: 14px; }
  .loading { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>Day 06 · Data Ingestion Engineering — Demo trực tiếp</h1>
  <span class="hint">Pipeline + benchmark thật trên pgvector &amp; sentence-transformers, không giả lập số liệu.</span>
  <nav>
    <button class="tab-btn active" data-tab="overview">1. Tổng quan dữ liệu</button>
    <button class="tab-btn" data-tab="strategies">2. So sánh 3 chiến lược</button>
    <button class="tab-btn" data-tab="audit">3. Audit thủ công</button>
    <button class="tab-btn" data-tab="chat">4. Chatbot tra cứu</button>
  </nav>
</header>

<main>
  <section id="tab-overview" class="tab active"><div class="loading">Đang tải...</div></section>
  <section id="tab-strategies" class="tab"><div class="loading">Đang tải...</div></section>
  <section id="tab-audit" class="tab"><div class="loading">Đang tải...</div></section>
  <section id="tab-chat" class="tab">
    <div id="chatTab">
      <div class="controls">
        <label>Chiến lược
          <select id="strategy">
            <option value="a">A · fixed-size</option>
            <option value="b">B · by_paragraph</option>
            <option value="c" selected>C · by_paragraph + filter</option>
          </select>
        </label>
        <label>Miền
          <select id="mien">
            <option value="">(không lọc)</option>
            <option value="Bắc">Bắc</option>
            <option value="Trung">Trung</option>
            <option value="Nam">Nam</option>
          </select>
        </label>
        <label style="display:flex; align-items:center; gap:6px; font-size:13px;">
          <input type="checkbox" id="genAnswer" />
          Trả lời bằng GPT (tổng hợp từ top-3)
        </label>
        <span id="llmStatus" class="note"></span>
      </div>
      <div id="chat">
        <div class="empty">Hỏi thử: "Vũng Tàu là đơn vị hành chính thuộc đâu?" hoặc "Sa Pa nằm ở độ cao bao nhiêu?"</div>
      </div>
      <footer>
        <input id="question" type="text" placeholder="Nhập câu hỏi về Nha Trang / Phú Quốc / Sa Pa / Vũng Tàu..." autocomplete="off" />
        <button id="send">Gửi</button>
      </footer>
    </div>
  </section>
</main>

<script>
// ---------- Tab switching ----------
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  });
});

const STRAT_COLOR = { a: 'var(--a)', b: 'var(--b)', c: 'var(--c)' };
const STRAT_LABEL = { a: 'A · fixed-size', b: 'B · by_paragraph', c: 'C · by_paragraph + filter' };

function bar(value, max, colorVar, text) {
  const pct = max > 0 ? Math.max(4, (value / max) * 100) : 0;
  return `<div class="barfill" style="width:${pct}%; background:${colorVar};">${text}</div>`;
}

// ---------- Tab 1: Overview ----------
async function loadOverview() {
  const el = document.getElementById('tab-overview');
  try {
    const res = await fetch('/api/overview');
    const d = await res.json();
    const m = d.manifest;
    const b = d.benchmark;
    el.innerHTML = `
      <h2>Corpus — ${m.sources.length} bài Wikipedia tiếng Việt (CC BY-SA 4.0 / GFDL)</h2>
      <div class="cards">
        <div class="card"><div class="num">${m.unit_count}</div><div class="label">unit nội dung (≥1500 ký tự/unit)</div></div>
        <div class="card"><div class="num">${m.total_chars.toLocaleString('vi-VN')}</div><div class="label">tổng ký tự</div></div>
        <div class="card"><div class="num">${m.mien_values.length}</div><div class="label">giá trị miền (${m.mien_values.join(', ')})</div></div>
        <div class="card"><div class="num">${m.sections.length}</div><div class="label">heading / mục khác nhau</div></div>
      </div>
      <div class="doc-grid">
        ${m.sources.map(s => `
          <div class="doc-card">
            <div class="title">${s.title}</div>
            <span class="mien-tag">Miền ${s.mien}</span>
            <div class="stats">${s.unit_count} unit · ${s.char_count.toLocaleString('vi-VN')} ký tự</div>
            <div class="stats" style="margin-top:4px; opacity:.7;">${s.source_path_or_url}</div>
          </div>
        `).join('')}
      </div>

      <h2>Benchmark — bộ câu hỏi đã xác minh với corpus</h2>
      <div class="cards">
        <div class="card"><div class="num">${b.total_questions}</div><div class="label">tổng câu hỏi</div></div>
        <div class="card"><div class="num">${b.dev}</div><div class="label">câu dev (chọn chiến lược)</div></div>
        <div class="card"><div class="num">${b.test}</div><div class="label">câu test (chỉ chạy 1 lần cuối)</div></div>
        <div class="card"><div class="num">${b.filter_questions}</div><div class="label">câu có metadata filter</div></div>
      </div>
      <p class="note">Mỗi câu có <code>evidence_quote</code> và <code>filter</code> đã được kiểm chứng bằng script
      (<code>scripts/verify_benchmark.py</code>) khớp đúng với trang gold trong corpus trước khi chạy benchmark.</p>
    `;
  } catch (err) {
    el.innerHTML = `<div class="empty">Lỗi tải dữ liệu tổng quan: ${err}</div>`;
  }
}

// ---------- Tab 2: Strategies ----------
async function loadStrategies() {
  const el = document.getElementById('tab-strategies');
  try {
    const res = await fetch('/api/strategies');
    const d = await res.json();
    const meta = d.run_meta;
    const sum = d.summary;
    const strategies = ['a', 'b', 'c'];

    const metaRows = strategies.map(s => {
      const m = meta.strategies[s];
      return `<tr>
        <td><span class="pill ${s}">${s.toUpperCase()}</span></td>
        <td>${m.chunking}</td>
        <td>${m.filter_on_search ? 'Có' : 'Không'}</td>
        <td>${m.n_chunks}</td>
        <td>${m.avg_len.toFixed(1)} ký tự</td>
        <td>${m.ingest_seconds.toFixed(2)}s</td>
        <td>$${m.embedding_cost_usd.toFixed(2)}</td>
      </tr>`;
    }).join('');

    function barsSection(title, getter, scaleIsPercent) {
      return `<h2>${title}</h2>` + strategies.map(s => {
        const v = getter(s);
        const label = scaleIsPercent ? `${(v * 100).toFixed(0)}%` : v;
        return `<div class="barrow">
          <div class="barlabel">${s.toUpperCase()}</div>
          <div class="bartrack">${bar(v, 1, STRAT_COLOR[s], label)}</div>
        </div>`;
      }).join('');
    }

    el.innerHTML = `
      <h2>Tham số &amp; tài nguyên</h2>
      <table>
        <thead><tr><th>Chiến lược</th><th>Chunking</th><th>Filter khi tìm</th><th>Số chunk</th><th>Độ dài TB</th><th>Thời gian ingest</th><th>Chi phí</th></tr></thead>
        <tbody>${metaRows}</tbody>
      </table>
      <p class="note">Embedding model: <b>${meta.embedding_model}</b> (${meta.dimensions} chiều) · Vector store: ${meta.vector_store} · Corpus: ${meta.corpus_units} unit.</p>

      ${barsSection('Hit@1 — tập dev (20 câu)', s => sum[s].dev.hit_at_1_rate, true)}
      ${barsSection('Evidence Hit@3 — tập dev (20 câu)', s => sum[s].dev.hit_at_3_rate, true)}
      ${barsSection('Hit@1 — tập test (7 câu, chỉ chạy 1 lần)', s => sum[s].test.hit_at_1_rate, true)}
      ${barsSection('Evidence Hit@3 — tập test (7 câu)', s => sum[s].test.hit_at_3_rate, true)}

      <h2>Filter compliance (11 câu có metadata filter, dev+test)</h2>
      ${strategies.map(s => {
        const [n, d2] = sum[s].filter_compliance.split('/').map(Number);
        return `<div class="barrow">
          <div class="barlabel">${s.toUpperCase()}</div>
          <div class="bartrack">${bar(n, d2, STRAT_COLOR[s], sum[s].filter_compliance)}</div>
        </div>`;
      }).join('')}
      <p class="note">A/B không chủ động lọc — số trùng ngẫu nhiên vì mỗi bài Wikipedia thường tự nhất quán 1 miền.
      C áp filter trực tiếp trong SQL (<code>WHERE mien = ...</code>) nên tuân thủ gần như tuyệt đối.</p>
    `;
  } catch (err) {
    el.innerHTML = `<div class="empty">Lỗi tải dữ liệu chiến lược: ${err}</div>`;
  }
}

// ---------- Tab 3: Audit ----------
async function loadAudit() {
  const el = document.getElementById('tab-audit');
  try {
    const res = await fetch('/api/audit');
    const d = await res.json();
    const strategies = ['a', 'b', 'c'];

    function section(key, title) {
      const block = d[key];
      const isRatio = typeof block.a === 'string';
      return `
        <h2>${title} <span class="note">(${block.scale})</span></h2>
        ${strategies.map(s => {
          let val = block[s];
          let display, num, denom;
          if (isRatio) {
            [num, denom] = val.split('/').map(Number);
            display = val;
          } else {
            num = val; denom = 2; display = `${val.toFixed(1)}/2`;
          }
          return `<div class="barrow">
            <div class="barlabel">${s.toUpperCase()}</div>
            <div class="bartrack">${bar(num, denom, STRAT_COLOR[s], display)}</div>
          </div>`;
        }).join('')}
        <p class="note">${block.note}</p>
      `;
    }

    el.innerHTML = `
      <p class="source-tag">${d.source}</p>
      ${section('coherence', '1. Chunk coherence')}
      ${section('metadata_usefulness', '2. Metadata usefulness')}
      ${section('filter_compliance', '2b. Filter compliance')}
      ${section('grounding_quality', '3. Grounding quality')}
    `;
  } catch (err) {
    el.innerHTML = `<div class="empty">Lỗi tải audit: ${err}</div>`;
  }
}

// ---------- Tab 4: Chat ----------
const chat = document.getElementById('chat');
const input = document.getElementById('question');
const sendBtn = document.getElementById('send');
const strategySel = document.getElementById('strategy');
const mienSel = document.getElementById('mien');
const genAnswerChk = document.getElementById('genAnswer');
const llmStatus = document.getElementById('llmStatus');

fetch('/api/llm_status').then(r => r.json()).then(d => {
  if (!d.configured) {
    llmStatus.textContent = '(chưa có OPENAI_API_KEY trong .env)';
    genAnswerChk.disabled = true;
  }
}).catch(() => {});

function clearEmpty() {
  const empty = chat.querySelector('.empty');
  if (empty) empty.remove();
}

function addUserMessage(text) {
  clearEmpty();
  const div = document.createElement('div');
  div.className = 'msg user';
  div.innerHTML = `<div class="bubble"></div>`;
  div.querySelector('.bubble').textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function addBotMessage(data) {
  const wrap = document.createElement('div');
  wrap.className = 'msg bot';
  const filterNote = data.filter ? ` (lọc miền: ${data.filter.mien})` : '';

  if (data.answer) {
    const ans = document.createElement('div');
    ans.className = 'bubble';
    ans.style.borderLeft = '3px solid var(--accent)';
    ans.textContent = data.answer;
    wrap.appendChild(ans);
  } else if (data.answer_error) {
    const err = document.createElement('div');
    err.className = 'bubble';
    err.style.color = '#f87171';
    err.textContent = `Lỗi GPT: ${data.answer_error}`;
    wrap.appendChild(err);
  }

  const header = document.createElement('div');
  header.className = 'bubble';
  header.textContent = data.hits.length
    ? `Chiến lược ${data.strategy.toUpperCase()}${filterNote} — top-${data.hits.length} đoạn trích liên quan nhất:`
    : `Chiến lược ${data.strategy.toUpperCase()}${filterNote} — không tìm thấy kết quả (thử bỏ lọc miền).`;
  wrap.appendChild(header);

  data.hits.forEach((h, i) => {
    const ev = document.createElement('div');
    ev.className = 'evidence';
    ev.innerHTML = `
      <div class="meta">
        <span>#${i + 1}</span>
        <span class="score">score ${h.score.toFixed(3)}</span>
        <span>nguồn: ${h.document_id}</span>
        <span>trang ${h.page}</span>
        <span>mục: ${h.section ?? '-'}</span>
        <span>miền: ${h.mien ?? '-'}</span>
      </div>
      <div class="text"></div>
    `;
    ev.querySelector('.text').textContent = h.text;
    wrap.appendChild(ev);
  });

  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
}

async function send() {
  const question = input.value.trim();
  if (!question) return;
  addUserMessage(question);
  input.value = '';
  sendBtn.disabled = true;

  try {
    const res = await fetch('/api/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        question,
        strategy: strategySel.value,
        mien: mienSel.value || null,
        top_k: 3,
        generate_answer: genAnswerChk.checked,
      }),
    });
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    addBotMessage(data);
  } catch (err) {
    const div = document.createElement('div');
    div.className = 'msg bot';
    div.innerHTML = `<div class="bubble">Lỗi: ${String(err)}</div>`;
    chat.appendChild(div);
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

sendBtn.addEventListener('click', send);
input.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });

// ---------- init ----------
loadOverview();
loadStrategies();
loadAudit();
</script>
</body>
</html>
